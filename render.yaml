# Render Blueprint: the whole system in one click (Render → New → Blueprint → this repo).
# Secrets are NOT stored here: after the first deploy add them once to the "yam-shared"
# environment group in the Render dashboard (see docs/RENDER.md).

envVarGroups:
  - name: yam-shared
    envVars:
      - key: SECRET_KEY            # encrypts the YouTube token in the DB; generated once, never change it
        generateValue: true
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: openai/gpt-4o-mini
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_REGION
        value: auto
      - key: TTS_PROVIDER
        value: edge
      - key: TIMEZONE
        value: Asia/Tashkent

databases:
  - name: yam-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []                # private network only

services:
  - type: keyvalue                 # Redis: Celery broker
    name: yam-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web                      # FastAPI backend
    name: yam-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - fromGroup: yam-shared
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: yam-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: yam-redis
          property: connectionString

  - type: worker                   # Celery worker + scheduler (FFmpeg rendering, publishing, analytics)
    name: yam-worker
    runtime: docker
    plan: standard                 # video rendering needs RAM; try "starter" later if renders succeed
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: ./scripts/start-worker.sh
    envVars:
      - fromGroup: yam-shared
      - key: DATABASE_URL
        fromDatabase:
          name: yam-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: yam-redis
          property: connectionString

  - type: web                      # Next.js dashboard (open this URL on your phone)
    name: yam-web
    runtime: docker
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: PORT
        value: "10000"
      - key: BACKEND_URL           # private-network address of the API (host:port)
        fromService:
          type: web
          name: yam-api
          property: hostport
