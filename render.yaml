# FREE setup (see docs/FREE.md): the dashboard + API run on Render's free plan.
# The pipeline itself runs on GitHub Actions (.github/workflows/runner.yml), the database and the
# media bucket live on Supabase. No Redis, no always-on worker.
#
# Secrets are NOT stored here: Render asks for them once while you create the Blueprint.
# The paid variant with an always-on worker is in deploy/render.paid.yaml (docs/RENDER.md).

services:
  - type: web                      # FastAPI backend (sleeps when idle; wakes on the first request)
    name: yam-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: QUEUE_MODE
        value: inline
      - key: STORAGE_BACKEND
        value: s3
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: openai/gpt-4o-mini
      - key: TTS_PROVIDER
        value: edge
      - key: TIMEZONE
        value: Asia/Tashkent
      - key: DATABASE_URL         # Supabase "Session pooler" connection string
        sync: false
      - key: ADMIN_TOKEN          # your password for the dashboard
        sync: false
      - key: SECRET_KEY           # random string; must be IDENTICAL in GitHub Secrets
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # added by hand after the first deploy (the URLs are not known yet): FRONTEND_URL

  - type: web                      # Next.js dashboard (open this URL on your phone)
    name: yam-web
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: PORT
        value: "10000"
      # added by hand after the first deploy: BACKEND_URL = public https URL of yam-api
