name: Runner

# The "worker" of the free setup: every 30 minutes it plans content, produces videos (FFmpeg),
# publishes what is due and collects analytics. State lives in the database, so every run
# simply continues where the previous one stopped. Needs the Secrets listed in docs/FREE.md.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: yam-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: backend
    env:
      QUEUE_MODE: inline
      STORAGE_BACKEND: s3
      TTS_PROVIDER: edge
      RUNNER_BUDGET_MINUTES: "45"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || 'openai/gpt-4o-mini' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_REGION: ${{ secrets.S3_REGION || 'auto' }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      TIMEZONE: ${{ secrets.TIMEZONE || 'Asia/Tashkent' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: FFmpeg and fonts
        run: |
          if ! command -v ffmpeg >/dev/null || ! fc-list | grep -qi dejavu; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation
          fi

      - run: pip install -r requirements.txt

      - name: Run one cycle
        run: python -m app.runner
