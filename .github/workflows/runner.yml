name: Runner

# The "worker" of the free setup: every 15 minutes (GitHub may delay scheduled runs) it plans content, produces videos (FFmpeg),
# publishes what is due and collects analytics. State lives in the database, so every run
# simply continues where the previous one stopped. Needs the Secrets listed in docs/FREE.md.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: yam-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: backend
    env:
      QUEUE_MODE: inline
      STORAGE_BACKEND: s3
      TTS_PROVIDER: edge
      RUNNER_BUDGET_MINUTES: "45"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
      LLM_MODEL: ${{ secrets.LLM_MODEL || 'openai/gpt-4o-mini' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_REGION: ${{ secrets.S3_REGION || 'auto' }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      TIMEZONE: ${{ secrets.TIMEZONE || 'Asia/Tashkent' }}
    steps:
      - name: Skip until the secrets are configured
        id: gate
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABASE_URL secret is not set yet - skipping (see docs/FREE.md, step 5)"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: FFmpeg and fonts
        if: steps.gate.outputs.skip != 'true'
        run: |
          # static FFmpeg build: ~10 s instead of ~5 min of `apt install ffmpeg` on every run
          if ! command -v ffmpeg >/dev/null; then
            mkdir -p "$HOME/ffbin" && cd "$HOME/ffbin"
            if curl -fsSL --retry 3 -o ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
               && tar -xJf ff.tar.xz --strip-components=1 && [ -x ffmpeg ]; then
              sudo install -m 755 ffmpeg ffprobe /usr/local/bin/
            else
              sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
            fi
          fi
          if ! fc-list | grep -qi dejavu; then
            sudo apt-get install -y -qq --no-install-recommends fonts-dejavu-core fonts-liberation \
              || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-dejavu-core fonts-liberation; }
          fi
          ffmpeg -version | head -1

      - run: pip install -r requirements.txt
        if: steps.gate.outputs.skip != 'true'

      - name: Run one cycle
        if: steps.gate.outputs.skip != 'true'
        run: python -m app.runner
