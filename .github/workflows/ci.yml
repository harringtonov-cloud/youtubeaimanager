name: CI

on:
  push:
    branches: [main, multi-channel]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System packages (FFmpeg + fonts)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app alembic
      - name: pytest
        run: |
          set +e
          pytest -q --tb=short -p no:cacheprovider > /tmp/pytest.out 2>&1
          code=$?
          tail -n 120 /tmp/pytest.out
          python - <<'PY'
          import re
          t = open("/tmp/pytest.out").read()[-6000:]
          t = t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=pytest-output::" + t)
          PY
          exit $code

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          BACKEND_URL: http://localhost:8000
